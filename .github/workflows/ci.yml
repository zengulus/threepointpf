name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Unit and integration tests
        run: pnpm test
      - name: Build
        run: pnpm build
      # Pages serves the demo from /threepointpf/, so the published build is
      # checked against that path rather than only against the site root.
      - name: Demo build resolves from the project path
        env:
          VITE_APP_MODE: browser
        run: pnpm build:demo && pnpm check:demo
      - name: Generated rules are fresh
        run: pnpm rules:check-autosheet
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser smoke test
        run: pnpm test:e2e
      - name: Hosted same-origin API smoke test
        run: pnpm --filter @threepointpf/web build:hosted && pnpm test:e2e:hosted
