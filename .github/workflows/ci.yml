name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: corepack pnpm install --frozen-lockfile
      - name: Unit and integration tests
        run: corepack pnpm test
      - name: Build
        run: corepack pnpm build
      # Pages serves the demo from /threepointpf/, so the published build is
      # checked against that path rather than only against the site root.
      - name: Demo build resolves from the project path
        env:
          VITE_APP_MODE: browser
        run: corepack pnpm build:demo && corepack pnpm check:demo
      - name: Generated rules are fresh
        run: corepack pnpm rules:check-autosheet
      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Browser smoke test
        run: corepack pnpm test:e2e
      - name: Hosted same-origin API smoke test
        run: corepack pnpm --filter @threepointpf/web build:hosted && corepack pnpm test:e2e:hosted
